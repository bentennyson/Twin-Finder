name: Build and publish desktop installers

on:
  push:
    branches: [installer-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt PyInstaller==6.21.0 pytest==8.4.2
          python -m pip check
          New-Item -ItemType Directory build-evidence -Force
          python -m pip freeze > build-evidence/python-packages.txt
      - name: Test source and bundled AI
        timeout-minutes: 5
        run: |
          python -m pytest tests -q --junitxml=build-evidence/tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop.py --self-test build-evidence/source.json
      - name: Build application and installer
        run: |
          python build_windows.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_installer.py --version 1.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and check the actual shipped application
        timeout-minutes: 5
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'TwinFinderInstalled'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer-output/TwinFinderSetup-1.0.1-Windows-x64.exe'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installRoot + '"'),('/LOG="' + $evidence + '/install.log"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $report = Join-Path $evidence 'installed.json'
          $p = Start-Process -FilePath (Join-Path $installRoot 'TwinFinder.exe') -ArgumentList @('--self-test',('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed application failed: $($p.ExitCode)" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or -not $result.tk_ui_constructed) { throw 'Installed application diagnostics failed' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'installer-output/SHA256SUMS-Windows.txt'), ($hash + '  TwinFinderSetup-1.0.1-Windows-x64.exe' + [Environment]::NewLine))
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: installer-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-installer-test-evidence
          path: build-evidence/
          retention-days: 7

  publish:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-installer
          path: windows-download
      - name: Retrieve the verified Mac build
        uses: actions/download-artifact@v4
        with:
          name: TwinFinder-macOS-AppleSilicon-test-build
          run-id: 41231512900
          github-token: ${{ github.token }}
          path: mac-download
      - name: Verify and publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: bentennyson/Twin-Finder
        run: |
          set -euo pipefail
          (cd windows-download && sha256sum -c SHA256SUMS-Windows.txt)
          (cd mac-download && sha256sum -c SHA256SUMS.txt)
          cp mac-download/SHA256SUMS.txt mac-download/SHA256SUMS-macOS.txt
          cat > "$RUNNER_TEMP/windows-notes.md" <<'EOF'
          Download **TwinFinderSetup-1.0.1-Windows-x64.exe** and run the installer.
          Windows 10/11, Intel/AMD 64-bit. Python and the AI models are included.
          Version 1.0.1 packages the current desktop source; the AI, review and feedback algorithms are unchanged.
          This build passed the 28-test suite, then a silent installation and neural/UI startup checks on Windows.
          The installer is unsigned. SHA256SUMS-Windows.txt provides the download checksum.
          EOF
          cat > "$RUNNER_TEMP/mac-notes.md" <<'EOF'
          Download **TwinFinder-1.0.0-macOS-AppleSilicon.dmg**, open it, and drag Twin Finder to Applications.
          Requires an Apple-silicon Mac and macOS 15 or later. Python and the AI models are included.
          This test build passed 28 tests and source, packaged-app and mounted-DMG diagnostics.
          It is ad-hoc signed and **not notarized by Apple**; Gatekeeper may block a downloaded copy.
          An independent interactive installation has not been verified. Intel Macs are not supported.
          Build evidence: https://github.com/bentennyson/Twin-Finder/actions/runs/41231512900
          EOF
          gh release create windows-v1.0.1 windows-download/TwinFinderSetup-1.0.1-Windows-x64.exe windows-download/SHA256SUMS-Windows.txt --target "$GITHUB_SHA" --title "Twin Finder 1.0.1 - Windows installer" --notes-file "$RUNNER_TEMP/windows-notes.md" --draft
          gh release edit windows-v1.0.1 --draft=false --latest
          gh release create macos-v1.0.0-test mac-download/TwinFinder-1.0.0-macOS-AppleSilicon.dmg mac-download/SHA256SUMS-macOS.txt --target 813662132c4393ed295fe0c19bdb435e4ebb7a91 --title "Twin Finder 1.0.0 - macOS test build" --notes-file "$RUNNER_TEMP/mac-notes.md" --prerelease --draft
          gh release edit macos-v1.0.0-test --draft=false --latest=false
